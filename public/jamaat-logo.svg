<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />
  
  <!-- Inner Decorative Dashed Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Radiant Light Rays behind the Quran -->
  <g stroke="#fef08a" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="90" x2="100" y2="40" />
    <line x1="100" y1="90" x2="65" y2="48" />
    <line x1="100" y1="90" x2="135" y2="48" />
    <line x1="100" y1="90" x2="45" y2="70" />
    <line x1="100" y1="90" x2="155" y2="70" />
  </g>

  <!-- Crescent Moon and Star at Top -->
  <path d="M 90 28 A 15 15 0 0 0 118 42 A 18 18 0 1 1 90 28 Z" fill="url(#goldGrad)" />
  <polygon points="118,30 120,35 125,35 121,38 123,43 118,40 114,43 115,38 111,35 116,35" fill="#fef08a" />

  <!-- Holy Quran Opened in Center -->
  <!-- Rehal / Book Stand -->
  <path d="M 68 120 L 100 102 L 132 120 L 126 128 L 100 112 L 74 128 Z" fill="#92400e" stroke="#f59e0b" stroke-width="1.5" />
  <path d="M 72 122 L 100 138 L 128 122" fill="none" stroke="#78350f" stroke-width="3" />

  <!-- Quran Pages Left and Right -->
  <!-- Left Page -->
  <path d="M 100 102 Q 80 82 56 86 L 58 112 Q 82 108 100 120 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <!-- Left Lines simulating verses -->
  <line x1="64" y1="93" x2="94" y2="100" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />
  <line x1="64" y1="99" x2="94" y2="106" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />
  <line x1="65" y1="105" x2="92" y2="111" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Page -->
  <path d="M 100 102 Q 120 82 144 86 L 142 112 Q 118 108 100 120 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <!-- Right Lines simulating verses -->
  <line x1="106" y1="100" x2="136" y2="93" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />
  <line x1="106" y1="106" x2="136" y2="99" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />
  <line x1="108" y1="111" x2="135" y2="105" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bottom Ribbon with Organization Name -->
  <path d="M 28 148 Q 100 168 172 148 L 168 172 Q 100 190 32 172 Z" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="2" />
  
  <text x="100" y="166" font-family="'Hind Siliguri', sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    বাংলাদেশ জামায়াতে ইসলামী
  </text>
</svg>
